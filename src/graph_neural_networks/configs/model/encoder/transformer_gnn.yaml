_target_: torch_geometric.nn.models.TransformerConv
in_channels: ${hparams.data.num_node_features}
hidden_channels: 64
out_channels: ${oc.select:hparams.data.num_classes, 1}
heads: 4 # multi-head attention (plus de heads = plus de stabilité)
concat: true # concatène les sorties des heads
dropout: 0.5 # dropout sur l’attention et les features
edge_dim: ${hparams.data.num_edge_features} # important si tu as des edge_attr
beta: false # garde False sauf si tu veux des skip connections résiduelles
act: relu
norm: layer_norm # LayerNorm fonctionne bien avec TransformerConv
num_layers: 4 # nombre total de couches (à définir dans ton script)
act_first: false
jk: null
