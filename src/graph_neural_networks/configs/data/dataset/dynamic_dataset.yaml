# @package _global_

defaults:
  - /data/dataset/base_dataset: ??? # Specify the base dataset name in the experiment
  - /data/dataset/extracted: qtseg # in (unet, radiomics, qtseg)
  - /data/dataset/graph_transforms: [
        oversample_nodes,
        compute_distance_matrix,
        add_edge_closest_cc,
      ] # list of graph transforms to apply (sublist of: [identity, add_distance_cc_edge, add_edge_closest_cc, add_supernodes, oversample_nodes, compute_distance_matrix])

data:
  dataset:
    _target_: graph_neural_networks.data.DynamicDataset

    handcrafted:
      node_features: [degree, reference_x, reference_y, radius] # list of node features to activate (sublist of: [degree, coord_x, coord_y, centered_normalized_x, centered_normalized_y, reference_x, reference_y, radius])
      edge_features: [] # list of edge features to activate (sublist of: [length, min_radius, max_radius, mean_radius, radius_decay])

    use_extracted: true
    extracted:
      aggregation: mean # in (mean, max, min, sum)
      sampling: radius_square # in (double_radius_square, radius_square, single_pixel)

    force_recompute: true

    base_dataset:
      raw_dir_name: raw_pred_state

hparams:
  data:
    num_node_features: ${eval:'len(${data.dataset.handcrafted.node_features}) + (${data.dataset.extracted.n_features} if ${data.dataset.use_extracted} else 0)'}
    # TODO num_edge_features
